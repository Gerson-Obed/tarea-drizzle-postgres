services:
  postgres:
    image: postgres:16-alpine
    container_name: tarea_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: tarea_user
      POSTGRES_PASSWORD: tarea_pass
      POSTGRES_DB: tarea_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tarea_user -d tarea_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
